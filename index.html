<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GoPotato's — Peça Já</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F4EEDF;
    --cream-card: #FFFCF5;
    --red: #C8202A;
    --red-deep: #8F1319;
    --maroon: #4A0F13;
    --gold: #E7A93C;
    --ink: #2A1B12;
    --ink-soft: #6b5c50;
    --brownie: #4a2c1d;
    --ok-green: #2f7d4f;
    --warn: #b5541c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:#d8cdb3; font-family:'DM Sans', sans-serif; color:var(--ink); }
  body { display:flex; justify-content:center; }
  .app { width:100%; max-width:460px; background:var(--cream); min-height:100vh; position:relative; padding-bottom:110px; }

  /* HEADER */
  .header { background:var(--red); padding:28px 22px 26px; text-align:center; color:var(--cream); position:relative; }
  .eyebrow { font-family:'Space Grotesk',sans-serif; font-size:11px; letter-spacing:3px; text-transform:uppercase; opacity:.85; margin:0 0 4px; }
  .brand { font-family:'Fraunces',serif; font-weight:900; font-size:38px; line-height:.95; margin:0; }
  .brand .apo { font-weight:500; }
  .tagline { font-family:'Fraunces',serif; font-style:italic; font-size:13.5px; margin:6px 0 0; opacity:.95; }
  .scallop { position:absolute; bottom:-1px; left:0; width:100%; height:18px;
    background: radial-gradient(circle at 9px 0, transparent 9.5px, var(--red) 10px) 0 -1px / 18px 18px repeat-x; }

  /* TABS */
  .tabs { display:flex; gap:8px; padding:22px 16px 6px; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:0 0 auto; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12.5px; letter-spacing:.5px;
    padding:9px 16px; border-radius:20px; background:var(--cream-card); color:var(--ink-soft); border:1.5px solid transparent; cursor:pointer; white-space:nowrap; }
  .tab.active { background:var(--maroon); color:var(--gold); }

  .section-sub { text-align:center; font-size:12px; color:var(--ink-soft); margin:8px 24px 2px; }

  /* PRODUCT LIST */
  .cards { padding:12px 16px 6px; display:flex; flex-direction:column; gap:12px; }
  .card { background:var(--cream-card); border-radius:18px; padding:12px; display:grid;
    grid-template-columns:64px 1fr; gap:12px; box-shadow:0 2px 6px rgba(74,15,19,.08); }
  .photo-wrap { width:64px; height:64px; border-radius:50%; overflow:hidden; border:3px solid var(--red); flex-shrink:0; align-self:start; }
  .card.especiais .photo-wrap { border-color:var(--gold); }
  .photo-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
  .info h3 { font-family:'Fraunces',serif; font-weight:700; font-size:14.5px; margin:0 0 2px; line-height:1.15; }
  .info p.desc { font-size:11px; margin:0 0 8px; color:var(--ink-soft); line-height:1.3; }
  .row-bottom { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .price-tag { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13.5px; color:var(--red-deep); }

  .add-btn { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12px; letter-spacing:.5px;
    background:var(--red); color:#fff; border:none; padding:7px 14px; border-radius:14px; cursor:pointer; }
  .add-btn:active { transform:scale(.96); }

  .stepper { display:flex; align-items:center; gap:10px; background:var(--maroon); border-radius:14px; padding:4px 6px; }
  .stepper button { width:22px; height:22px; border-radius:50%; border:none; background:var(--gold); color:var(--maroon);
    font-weight:700; font-size:14px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .stepper span { color:#FBEFE2; font-weight:700; font-size:13px; min-width:14px; text-align:center; }

  /* DRINKS / DESSERT generic icon cards */
  .drink-card { background:var(--cream-card); border-radius:18px; padding:14px; display:grid; grid-template-columns:52px 1fr; gap:12px; align-items:center; box-shadow:0 2px 6px rgba(74,15,19,.08); }
  .can { width:40px; height:52px; border-radius:6px 6px 10px 10px; margin:0 auto; position:relative; }
  .can.normal { background:linear-gradient(180deg,#c8202a 0%,#8f1319 100%); }
  .can.zero { background:linear-gradient(180deg,#2a1b12 0%,#000 100%); }
  .can::after { content:''; position:absolute; top:6px; left:6px; right:6px; height:2px; background:rgba(255,255,255,.3); border-radius:2px; }
  .brownie-icon { width:44px; height:44px; margin:0 auto; border-radius:8px; background:linear-gradient(155deg,#5c3826,var(--brownie) 60%); position:relative; box-shadow:inset 0 -4px 6px rgba(0,0,0,.35); }
  .brownie-icon::after { content:''; position:absolute; top:8px; left:8px; right:8px; height:5px; border-radius:3px; background:rgba(255,255,255,.15); }
  .drink-card h3 { font-family:'Fraunces',serif; font-weight:700; font-size:14.5px; margin:0 0 2px; }
  .drink-card p.desc { font-size:11px; margin:0 0 8px; color:var(--ink-soft); }

  /* COMBO BUILDER */
  .combo-box { background:var(--maroon); border-radius:22px; margin:14px 16px; padding:20px 16px; color:var(--cream); }
  .combo-box h2 { font-family:'Fraunces',serif; font-weight:700; font-size:17px; margin:0 0 4px; color:var(--gold); text-align:center; }
  .combo-box .sub { text-align:center; font-size:11.5px; color:#d9b8ab; margin:0 0 16px; }
  .combo-field { margin-bottom:12px; }
  .combo-field label { display:block; font-family:'Space Grotesk',sans-serif; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--gold); margin-bottom:6px; }
  .combo-field select {
    width:100%; padding:11px 12px; border-radius:12px; border:none; font-family:'DM Sans',sans-serif; font-size:13.5px;
    background:#FBEFE2; color:var(--ink); appearance:none;
  }
  .coca-toggle { display:flex; gap:8px; }
  .coca-toggle button { flex:1; padding:10px; border-radius:12px; border:1.5px solid #d9b8ab; background:transparent; color:#FBEFE2; font-family:'DM Sans',sans-serif; font-size:12.5px; font-weight:700; cursor:pointer; }
  .coca-toggle button.selected { background:var(--gold); color:var(--maroon); border-color:var(--gold); }
  .combo-price-row { display:flex; align-items:center; justify-content:space-between; margin:14px 4px 4px; }
  .combo-price-row .label { font-size:11.5px; color:#d9b8ab; }
  .combo-price-row .value { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; color:var(--gold); }
  .combo-price-row .old { font-size:11.5px; color:#d9b8ab; text-decoration:line-through; margin-right:6px; }
  .combo-add-btn { width:100%; margin-top:12px; background:var(--gold); color:var(--maroon); border:none; padding:12px; border-radius:14px;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13.5px; letter-spacing:.5px; cursor:pointer; }

  /* CART BAR */
  .cart-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:460px;
    background:var(--red); padding:14px 18px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 -6px 20px rgba(0,0,0,.25); z-index:20; }
  .cart-bar.hidden { display:none; }
  .cart-bar .count-badge { background:var(--gold); color:var(--maroon); font-weight:700; font-size:12px; border-radius:50%;
    width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; margin-right:8px; }
  .cart-bar .left { color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; display:flex; align-items:center; }
  .cart-bar .total { color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; margin-left:10px; }
  .cart-bar button.view-cart { background:var(--gold); color:var(--maroon); border:none; padding:10px 18px; border-radius:14px;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; cursor:pointer; }

  /* CART DRAWER */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:30; display:none; justify-content:center; }
  .overlay.open { display:flex; align-items:flex-end; }
  .drawer { width:100%; max-width:460px; background:var(--cream); border-radius:24px 24px 0 0; max-height:88vh; overflow-y:auto; padding:20px 18px 24px; position:relative; }
  .drawer h2 { font-family:'Fraunces',serif; font-size:19px; margin:0 0 4px; color:var(--red-deep); }
  .drawer .close-x { position:absolute; top:14px; right:22px; font-size:20px; color:var(--ink-soft); cursor:pointer; background:none; border:none; }
  .drawer-empty { text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 10px; }
  .cart-item { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid rgba(74,15,19,.1); }
  .cart-item .ci-info { flex:1; }
  .cart-item h4 { font-family:'Fraunces',serif; font-size:13.5px; margin:0 0 2px; }
  .cart-item .ci-price { font-size:11.5px; color:var(--ink-soft); }
  .cart-item .stepper { background:var(--maroon); }

  /* CUSTOMER FORM */
  .customer-form { margin-top:18px; padding-top:16px; border-top:2px dashed rgba(74,15,19,.2); }
  .customer-form h3 { font-family:'Fraunces',serif; font-size:15.5px; color:var(--red-deep); margin:0 0 12px; }
  .form-field { margin-bottom:10px; }
  .form-field label { display:block; font-family:'Space Grotesk',sans-serif; font-size:10.5px; letter-spacing:.8px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:5px; }
  .form-field input, .form-field select {
    width:100%; padding:10px 12px; border-radius:12px; border:1.5px solid #e2d6bd; font-family:'DM Sans',sans-serif; font-size:13.5px;
    background:var(--cream-card); color:var(--ink);
  }
  .form-field input:focus, .form-field select:focus { outline:none; border-color:var(--red); }
  .city-fixed { font-size:11.5px; color:var(--ink-soft); margin:-4px 0 12px 2px; }
  .form-row { display:flex; gap:8px; }
  .form-row .form-field { flex:1; }

  .calc-frete-btn { width:100%; background:var(--maroon); color:var(--gold); border:none; padding:11px; border-radius:12px;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; letter-spacing:.4px; cursor:pointer; margin-top:2px; }

  .frete-result { margin-top:10px; padding:10px 12px; border-radius:12px; font-size:12.5px; }
  .frete-result.ok { background:#e4f0e8; color:var(--ok-green); }
  .frete-result.manual { background:#f5e6d8; color:var(--warn); }
  .frete-result.loading { background:#eee; color:var(--ink-soft); }
  .frete-result.error { background:#f8e0e0; color:var(--red-deep); }

  .drawer-summary { margin-top:14px; padding-top:12px; border-top:2px dashed rgba(74,15,19,.2); }
  .summary-row { display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:6px; }
  .summary-row.total { font-weight:700; font-size:17px; color:var(--red-deep); font-family:'Space Grotesk',sans-serif; }

  .checkout-btn { width:100%; margin-top:16px; background:#25D366; color:#fff; border:none; padding:15px; border-radius:16px;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14.5px; letter-spacing:.3px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px; }
  .checkout-btn:disabled { opacity:.5; cursor:not-allowed; }
  .checkout-btn svg { width:20px; height:20px; }
  .checkout-hint { text-align:center; font-size:11px; color:var(--red-deep); margin-top:8px; }

  .footer-note { text-align:center; font-size:10.5px; color:var(--ink-soft); padding:22px 24px 0; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <p class="eyebrow">Batatas Recheadas · No Pote</p>
    <h1 class="brand">GoPotato<span class="apo">'s</span></h1>
    <p class="tagline">monte seu pedido e receba no conforto de casa</p>
    <div class="scallop"></div>
  </div>

    <div class="tab" data-cat="sobremesas">Sobremesas</div>

  <div id="content"></div>

  <p class="footer-note">GoPotato's · Batatas Recheadas · Avenida 21 de Abril, 636 · Divinópolis - MG</p>
</div>

<div class="cart-bar hidden" id="cartBar">
  <div class="left"><span class="count-badge" id="cartCount">0</span> na sacola <span class="total" id="cartTotal">R$ 0,00</span></div>
  <button class="view-cart" id="viewCartBtn">Ver sacola</button>
</div>

<div class="overlay" id="overlay">
  <div class="drawer">
    <button class="close-x" id="closeDrawer">✕</button>
    <h2>Sua sacola</h2>
    <div id="cartItems"></div>
    <div id="drawerExtra"></div>
  </div>
</div>

function brl(v){ return "R$ " + v.toFixed(2).replace(".", ","); }
function escAttr(s){ return s.replace(/'/g, "\\'"); }

function addToCart(id, name, price, qty=1){
  if(!cart[id]) cart[id] = { name, price, qty:0 };
  cart[id].qty += qty;
  if(cart[id].qty <= 0) delete cart[id];
  renderAll();
}

function cartCount(){ return Object.values(cart).reduce((s,i)=>s+i.qty,0); }
function cartTotal(){ return Object.values(cart).reduce((s,i)=>s+i.qty*i.price,0); }

function renderTabs(){

  });
}

function stepperOrAdd(id, name, price){
  const inCart = cart[id];
  const qty = inCart ? inCart.qty : 0;
  return qty > 0
    ? `<div class="stepper">
        <button onclick="addToCart('${id}','${escAttr(name)}',${price},-1)">−</button>
        <span>${qty}</span>
        <button onclick="addToCart('${id}','${escAttr(name)}',${price},1)">+</button>
       </div>`
    : `<button class="add-btn" onclick="addToCart('${id}','${escAttr(name)}',${price},1)">Adicionar</button>`;
}

/* ---------- FRETE ---------- */
function haversine(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function calcFreteValue(distanceKm){
  if(distanceKm <= FREE_RADIUS_KM) return 0;
  const extraKm = Math.ceil(distanceKm - FREE_RADIUS_KM);
  return FRETE_MINIMO + FRETE_POR_KM_EXTRA * (extraKm - 1);
}

  const controller = new AbortController();
  const timeoutId = setTimeout(()=>controller.abort(), 8000);
  let resp;
  try {
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q=${encodeURIComponent(address)}`;
    resp = await fetch(url, { headers: { "Accept-Language": "pt-BR" }, signal: controller.signal });
  } catch(networkErr){
    clearTimeout(timeoutId);
    console.error("[GoPotato's] Erro de rede ao geocodificar:", address, networkErr);
    const err = new Error("network");
    err.isNetwork = true;
    throw err;
  }
  clearTimeout(timeoutId);
  if(!resp.ok){
    console.error("[GoPotato's] Resposta não-OK do serviço de geolocalização:", resp.status, address);
    return null;
  }
  const data = await resp.json();
  if(data && data.length > 0){
    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
  }
  console.warn("[GoPotato's] Endereço não encontrado:", address);
  return null;
}

// tenta várias variações de escrita (ex: "21 de Abril" vs "Vinte e Um de Abril",
// já que o OpenStreetMap às vezes cadastra o nome da rua por extenso)
async function geocodeWithFallback(variants){
  for(const addr of variants){
    const coords = await geocodeAddress(addr);
    if(coords) return coords;
  }
  return null;
}

async function calcularFrete(){
  const rua = document.getElementById("custStreet").value.trim();
  const bairro = document.getElementById("custNeighborhood").value.trim();
  custStreet = rua;
  custNeighborhood = bairro;
  if(!rua){
    freteStatus = "error";
    renderDrawer();
    return;
  }
  freteStatus = "loading";
  freteApprox = false;
  renderDrawer();
  try {
    if(!storeCoords){
      storeCoords = await geocodeWithFallback(STORE_ADDRESS_VARIANTS);
    }
    if(!storeCoords) throw new Error("store-not-found");

    // tenta o endereço completo primeiro; se não achar, vai afrouxando (menos preciso)
    const custVariants = [];
    if(rua && bairro) custVariants.push(`${rua}, ${bairro}, Divinópolis, MG, Brasil`);
    if(rua) custVariants.push(`${rua}, Divinópolis, MG, Brasil`);
    if(bairro) custVariants.push(`${bairro}, Divinópolis, MG, Brasil`);

    let custCoords = null;
    let approx = false;
    for(let i=0; i<custVariants.length; i++){
      custCoords = await geocodeAddress(custVariants[i]);
      if(custCoords){ approx = i > 0; break; }
    }
    if(!custCoords) throw new Error("customer-not-found");

    const dist = haversine(storeCoords.lat, storeCoords.lon, custCoords.lat, custCoords.lon);
    freteDistance = dist;
    freteValue = calcFreteValue(dist);
    freteApprox = approx;
    freteStatus = "ok";
  } catch(e){
    console.error("[GoPotato's] Erro ao calcular frete:", e);
    freteStatus = e && e.isNetwork ? "network-error" : "manual";
    freteValue = null;
    freteDistance = null;
  }
  renderDrawer();
}

function freteResultHTML(){
  if(freteStatus === "loading"){
    return `<div class="frete-result loading">Calculando distância até seu endereço...</div>`;
  }
  if(freteStatus === "ok"){
    const approxNote = freteApprox ? " (estimativa aproximada pelo bairro)" : "";
    if(freteValue === 0){
      return `<div class="frete-result ok">🎉 Frete grátis! Você está a ${freteDistance.toFixed(1)}km da loja (dentro do raio de ${FREE_RADIUS_KM}km)${approxNote}.</div>`;
    }
    return `<div class="frete-result ok">Frete: ${brl(freteValue)} · aproximadamente ${freteDistance.toFixed(1)}km da loja${approxNote}.</div>`;
  }
  if(freteStatus === "manual"){
    return `<div class="frete-result manual">Não conseguimos localizar esse endereço automaticamente. Confira se a rua está escrita certinha, ou finalize mesmo assim — combinamos o frete pelo WhatsApp.</div>`;
  }
  if(freteStatus === "network-error"){
    return `<div class="frete-result manual">Não conseguimos conectar ao serviço de localização agora. Pode finalizar mesmo assim — combinamos o frete pelo WhatsApp.</div>`;
  }
  if(freteStatus === "error"){
    return `<div class="frete-result error">Preencha rua e número antes de calcular o frete.</div>`;
  }
  return "";
}

function customerFormHTML(){
  return `
    <div class="customer-form">
      <h3>Seus dados para entrega</h3>
      <div class="form-field">
        <label>Nome completo</label>
        <input type="text" id="custName" value="${custName}" placeholder="Seu nome">
      </div>
      <div class="form-field">
        <label>Rua e número</label>
        <input type="text" id="custStreet" value="${custStreet}" placeholder="Ex: Rua Goiás, 123">
      </div>
      <div class="form-field">
        <label>Bairro</label>
        <input type="text" id="custNeighborhood" value="${custNeighborhood}" placeholder="Ex: Centro">
      </div>
      <p class="city-fixed">Divinópolis - MG</p>

      <div class="form-field">
        <label>Forma de pagamento</label>
        <select id="custPayment">
          <option value="" ${custPayment===""?"selected":""}>Selecione</option>
          <option value="Dinheiro" ${custPayment==="Dinheiro"?"selected":""}>Dinheiro</option>
          <option value="Cartão" ${custPayment==="Cartão"?"selected":""}>Cartão</option>
          <option value="Pix" ${custPayment==="Pix"?"selected":""}>Pix</option>
        </select>
      </div>
      ${custPayment === "Dinheiro" ? `
      <div class="form-field">
        <label>Troco para quanto?</label>
        <input type="text" id="custTroco" value="${custTroco}" placeholder="Ex: 50">
      </div>` : ""}

      <button class="calc-frete-btn" id="calcFreteBtn">Calcular frete</button>
      ${freteResultHTML()}
    </div>
  `;
}

function summaryHTML(){
  const subtotal = cartTotal();
  const frete = freteStatus === "ok" ? freteValue : 0;
  const total = subtotal + frete;
  let freteLine = "";
  if(freteStatus === "ok"){
    freteLine = `<div class="summary-row"><span>Frete</span><span>${freteValue === 0 ? "Grátis" : brl(freteValue)}</span></div>`;
  } else if(freteStatus === "manual" || freteStatus === "network-error"){
    freteLine = `<div class="summary-row"><span>Frete</span><span>A combinar</span></div>`;
  }
  return `
    <div class="drawer-summary">
      <div class="summary-row"><span>Subtotal</span><span>${brl(subtotal)}</span></div>
      ${freteLine}
      <div class="summary-row total"><span>Total</span><span>${brl(total)}</span></div>
      <button class="checkout-btn" id="checkoutBtn">
        <svg viewBox="0 0 24 24" fill="white"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.29-1.39a9.9 9.9 0 0 0 4.75 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2z"/></svg>
        Finalizar pelo WhatsApp
      </button>
    </div>
  `;
}

function renderDrawer(){
  const itemsEl = document.getElementById("cartItems");
  const extraEl = document.getElementById("drawerExtra");
  const ids = Object.keys(cart);
  if(ids.length === 0){
    itemsEl.innerHTML = `<div class="drawer-empty">Sua sacola está vazia.<br>Adicione umas batatas! 🥔</div>`;
    extraEl.innerHTML = "";
    return;
  }
  itemsEl.innerHTML = ids.map(id=>{
    const it = cart[id];
    return `
      <div class="cart-item">
        <div class="ci-info">
          <h4>${it.name}</h4>
          <div class="ci-price">${brl(it.price)} cada</div>
        </div>
        <div class="stepper">
          <button onclick="addToCart('${id}','${escAttr(it.name)}',${it.price},-1)">−</button>
          <span>${it.qty}</span>
          <button onclick="addToCart('${id}','${escAttr(it.name)}',${it.price},1)">+</button>
        </div>
      </div>`;
  }).join("");

  extraEl.innerHTML = customerFormHTML() + summaryHTML();

  document.getElementById("custName").addEventListener("input", (e)=>{ custName = e.target.value; });
  document.getElementById("custStreet").addEventListener("input", (e)=>{ custStreet = e.target.value; });
  document.getElementById("custNeighborhood").addEventListener("input", (e)=>{ custNeighborhood = e.target.value; });
  document.getElementById("custPayment").addEventListener("change", (e)=>{ custPayment = e.target.value; renderDrawer(); });
  const trocoEl = document.getElementById("custTroco");
  if(trocoEl) trocoEl.addEventListener("input", (e)=>{ custTroco = e.target.value; });
  document.getElementById("calcFreteBtn").addEventListener("click", calcularFrete);
  document.getElementById("checkoutBtn").addEventListener("click", handleCheckout);
}

function renderAll(){
  renderTabs();
  renderContent();
  renderCartBar();
  renderDrawer();
}

document.getElementById("tabs").addEventListener("click",(e)=>{
  const tab = e.target.closest(".tab");
  if(!tab) return;
  activeCat = tab.dataset.cat;
  renderAll();
});

document.getElementById("viewCartBtn").addEventListener("click", ()=>{
  document.getElementById("overlay").classList.add("open");
});
document.getElementById("closeDrawer").addEventListener("click", ()=>{
  document.getElementById("overlay").classList.remove("open");
});
document.getElementById("overlay").addEventListener("click",(e)=>{
  if(e.target.id === "overlay") document.getElementById("overlay").classList.remove("open");
});

function handleCheckout(){
  const ids = Object.keys(cart);
  if(ids.length === 0) return;

  if(!custName.trim() || !custStreet.trim() || !custNeighborhood.trim() || !custPayment){
    alert("Preencha nome, endereço, bairro e forma de pagamento antes de finalizar.");
    return;
  }
  if(freteStatus === null || freteStatus === "loading" || freteStatus === "error"){
    alert("Calcule o frete antes de finalizar o pedido.");
    return;
  }

  const subtotal = cartTotal();
  const frete = freteStatus === "ok" ? freteValue : 0;
  const total = subtotal + frete;

  let msg = "Olá! Gostaria de fazer o seguinte pedido no *GoPotato's*:\n\n";
  ids.forEach(id=>{
    const it = cart[id];
    msg += `• ${it.qty}x ${it.name} — ${brl(it.price)} cada = ${brl(it.qty*it.price)}\n`;
  });
  msg += `\n*Subtotal:* ${brl(subtotal)}\n`;
  if(freteStatus === "ok"){
    msg += `*Frete:* ${freteValue === 0 ? "Grátis" : brl(freteValue)} (${freteDistance.toFixed(1)}km)\n`;
  } else {
    msg += `*Frete:* a combinar (endereço não localizado automaticamente)\n`;
  }
  msg += `*Total: ${brl(total)}*\n\n`;
  msg += `*Nome:* ${custName}\n`;
  msg += `*Endereço:* ${custStreet}, ${custNeighborhood} - Divinópolis, MG\n`;
  msg += `*Forma de pagamento:* ${custPayment}`;
  if(custPayment === "Dinheiro" && custTroco.trim()){
    msg += ` (troco para ${custTroco})`;
  }

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank");
}

renderAll();
</script>
